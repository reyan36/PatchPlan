<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="'JetBrains Mono','IBM Plex Mono',Consolas,'Courier New',monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a"/>
    </marker>
  </defs>

  <rect width="1200" height="330" fill="#f3f0e8"/>

  <rect x="40" y="28" width="560" height="52" fill="#0a0a0a"/>
  <text x="58" y="62" font-size="22" font-weight="800" fill="#c8ff00" letter-spacing="1">PLAYER SIGNAL / FEEDBACK → PATCH</text>

  <!-- Steps: x = 40 + i * 190, width 164 -->
  <g>
    <rect x="48" y="128" width="164" height="150" fill="#0a0a0a"/>
    <rect x="40" y="120" width="164" height="150" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/>
    <text x="56" y="146" font-size="12" font-weight="700" fill="#0a0a0a">01</text>
    <text x="56" y="176" font-size="18" font-weight="800" fill="#0a0a0a">COLLECT</text>
    <text x="56" y="204" font-size="12" fill="#0a0a0a">Discord · Steam</text>
    <text x="56" y="222" font-size="12" fill="#0a0a0a">Reddit · pasted</text>
    <text x="56" y="240" font-size="12" fill="#0a0a0a">reports</text>
  </g>
  <line x1="204" y1="195" x2="226" y2="195" stroke="#0a0a0a" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="238" y="128" width="164" height="150" fill="#0a0a0a"/>
    <rect x="230" y="120" width="164" height="150" fill="#c8ff00" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="320" y="132" width="62" height="20" fill="#0a0a0a"/>
    <text x="351" y="146" font-size="11" font-weight="800" fill="#c8ff00" text-anchor="middle">NANO</text>
    <text x="246" y="146" font-size="12" font-weight="700" fill="#0a0a0a">02</text>
    <text x="246" y="176" font-size="18" font-weight="800" fill="#0a0a0a">TRIAGE</text>
    <text x="246" y="204" font-size="12" fill="#0a0a0a">Bug · balance</text>
    <text x="246" y="222" font-size="12" fill="#0a0a0a">feature · praise</text>
    <text x="246" y="240" font-size="12" fill="#0a0a0a">duplicates merged</text>
  </g>
  <line x1="394" y1="195" x2="416" y2="195" stroke="#0a0a0a" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="428" y="128" width="164" height="150" fill="#0a0a0a"/>
    <rect x="420" y="120" width="164" height="150" fill="#c8ff00" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="510" y="132" width="62" height="20" fill="#0a0a0a"/>
    <text x="541" y="146" font-size="11" font-weight="800" fill="#c8ff00" text-anchor="middle">SUPER</text>
    <text x="436" y="146" font-size="12" font-weight="700" fill="#0a0a0a">03</text>
    <text x="436" y="176" font-size="18" font-weight="800" fill="#0a0a0a">MATCH</text>
    <text x="436" y="204" font-size="12" fill="#0a0a0a">Linked to a board</text>
    <text x="436" y="222" font-size="12" fill="#0a0a0a">task, or a new</text>
    <text x="436" y="240" font-size="12" fill="#0a0a0a">one is drafted</text>
  </g>
  <line x1="584" y1="195" x2="606" y2="195" stroke="#0a0a0a" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="618" y="128" width="164" height="150" fill="#0a0a0a"/>
    <rect x="610" y="120" width="164" height="150" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="700" y="132" width="62" height="20" fill="#0a0a0a"/>
    <text x="731" y="146" font-size="11" font-weight="800" fill="#f3f0e8" text-anchor="middle">YOU</text>
    <text x="626" y="146" font-size="12" font-weight="700" fill="#0a0a0a">04</text>
    <text x="626" y="176" font-size="18" font-weight="800" fill="#0a0a0a">APPROVE</text>
    <text x="626" y="204" font-size="12" fill="#0a0a0a">One click puts</text>
    <text x="626" y="222" font-size="12" fill="#0a0a0a">it on the board</text>
  </g>
  <line x1="774" y1="195" x2="796" y2="195" stroke="#0a0a0a" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="808" y="128" width="164" height="150" fill="#0a0a0a"/>
    <rect x="800" y="120" width="164" height="150" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="890" y="132" width="62" height="20" fill="#0a0a0a"/>
    <text x="921" y="146" font-size="11" font-weight="800" fill="#f3f0e8" text-anchor="middle">TEAM</text>
    <text x="816" y="146" font-size="12" font-weight="700" fill="#0a0a0a">05</text>
    <text x="816" y="176" font-size="18" font-weight="800" fill="#0a0a0a">SHIP</text>
    <text x="816" y="204" font-size="12" fill="#0a0a0a">Task moves</text>
    <text x="816" y="222" font-size="12" fill="#0a0a0a">to Done</text>
  </g>
  <line x1="964" y1="195" x2="986" y2="195" stroke="#0a0a0a" stroke-width="3" marker-end="url(#a)"/>

  <g>
    <rect x="1004" y="128" width="164" height="150" fill="#0a0a0a"/>
    <rect x="996" y="120" width="164" height="150" fill="#c8ff00" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="1086" y="132" width="62" height="20" fill="#0a0a0a"/>
    <text x="1117" y="146" font-size="11" font-weight="800" fill="#c8ff00" text-anchor="middle">SUPER</text>
    <text x="1012" y="146" font-size="12" font-weight="700" fill="#0a0a0a">06</text>
    <text x="1012" y="176" font-size="18" font-weight="800" fill="#0a0a0a">PUBLISH</text>
    <text x="1012" y="204" font-size="12" fill="#0a0a0a">Patch notes to</text>
    <text x="1012" y="222" font-size="12" fill="#0a0a0a">News, Roadmap</text>
    <text x="1012" y="240" font-size="12" fill="#0a0a0a">and Discord</text>
  </g>

  <text x="40" y="306" font-size="12" font-weight="700" fill="#0a0a0a">PLAYERS WHO REPORTED AN ISSUE ARE CREDITED WHEN THE FIX SHIPS.</text>
</svg>
